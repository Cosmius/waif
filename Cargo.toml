[package]
name = "waif"
version = "0.4.0-dev"
edition = "2021"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
clap = { version = "=4.6.7", features = ["derive"] }
indoc = "=2.0.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha1_smol = "=1.0.1"
toml = "=1.1.8"
zip = { version = "=9.2.0", default-features = false }
